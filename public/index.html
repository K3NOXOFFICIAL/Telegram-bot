<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Telegram Bot - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .content {
            padding: 40px;
        }
        .control-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .control-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        .btn-status {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .btn-clear {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }
        .status-display {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-display pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #0088cc;
            margin: 10px 0;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .stat-running {
            animation: pulse 2s infinite;
            border-color: #28a745 !important;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid;
        }
        .alert-success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .alert-info {
            background: #d1ecf1;
            border-color: #0c5460;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 OneDrive Telegram Bot</h1>
            <p>Control Panel & Monitor</p>
        </div>
        
        <div class="content">
            <div class="control-panel">
                <h2>🎮 Sync Control</h2>
                <div class="button-group">
                    <button class="btn-start" onclick="startSync()">
                        ▶️ Start Sync
                    </button>
                    <button class="btn-stop" onclick="stopSync()">
                        ⏸️ Stop Sync
                    </button>
                    <button class="btn-status" onclick="checkStatus()">
                        📊 Status
                    </button>
                    <button class="btn-clear" onclick="clearRedis()">
                        🗑️ Clear Redis
                    </button>
                </div>
                
                <div id="alert-container"></div>
                
                <div id="stats" class="stats-grid" style="display:none;"></div>
                
                <div id="output" class="status-display">
                    <div class="loading">Click a button to get started...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let syncRunning = false;

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function updateOutput(data, title = '') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleString('de-DE');
            output.innerHTML = `
                <strong>${title}</strong><br>
                <small>🕐 ${timestamp}</small><br><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        function updateStats(data) {
            const statsDiv = document.getElementById('stats');
            
            if (data.state || data.currentSync) {
                statsDiv.style.display = 'grid';
                
                let statsHTML = '';
                
                // Zeige aktuelle Sync-Stats wenn verfügbar
                if (data.currentSync) {
                    const isRunning = data.currentSync.isRunning;
                    const progress = data.currentSync.filesFound > 0 
                        ? Math.round((data.currentSync.filesPosted / data.currentSync.filesFound) * 100)
                        : 0;
                    
                    statsHTML += `
                        <div class="stat-card ${isRunning ? 'stat-running' : ''}">
                            <div class="stat-label">Status</div>
                            <div class="stat-value">${isRunning ? '🔄 Running' : '✅ Idle'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Files Uploaded</div>
                            <div class="stat-value">${data.currentSync.filesPosted || 0} / ${data.currentSync.filesFound || 0}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Progress</div>
                            <div class="stat-value">${progress}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Folders</div>
                            <div class="stat-value">${data.currentSync.foldersScanned || 0}</div>
                        </div>
                    `;
                }
                
                // Zeige Gesamt-Stats
                if (data.state) {
                    statsHTML += `
                        <div class="stat-card">
                            <div class="stat-label">Total Posted Files</div>
                            <div class="stat-value">${data.state.totalPostedFiles || 0}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Topics</div>
                            <div class="stat-value">${data.topics ? data.topics.length : (data.state.totalTopicMappings || 0)}</div>
                        </div>
                    `;
                }
                
                statsDiv.innerHTML = statsHTML;
            }
        }

        let autoRefreshInterval = null;
        
        function startAutoRefresh() {
            // Aktualisiere Status alle 3 Sekunden
            if (!autoRefreshInterval) {
                autoRefreshInterval = setInterval(() => {
                    checkStatus(true); // Silent mode
                }, 3000);
                console.log('🔄 Auto-refresh gestartet');
            }
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('⏸️ Auto-refresh gestoppt');
            }
        }

        async function startSync(event) {
            const btn = event?.target;
            if (btn) btn.disabled = true;
            
            showAlert('🚀 Starting sync...', 'info');
            updateOutput({ status: 'Starting sync...' }, '▶️ Start Sync');
            
            try {
                const response = await fetch('/api/sync');
                const data = await response.json();
                
                updateOutput(data, '▶️ Sync Result');
                updateStats(data);
                
                if (data.success) {
                    showAlert('✅ Sync started! Auto-refreshing status...', 'success');
                    startAutoRefresh();
                } else {
                    showAlert('❌ Sync failed: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function stopSync(event) {
            const btn = event?.target;
            if (btn) btn.disabled = true;
            
            showAlert('⏸️ Stopping sync...', 'info');
            updateOutput({ status: 'Stopping sync...' }, '⏸️ Stop Sync');
            
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                
                updateOutput(data, '⏸️ Stop Result');
                
                if (data.success) {
                    showAlert('✅ Sync stopped! Lock released.', 'success');
                    stopAutoRefresh();
                } else {
                    showAlert('❌ Failed to stop sync', 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function checkStatus(event, silent = false) {
            // Handle both direct calls and event-based calls
            if (typeof event === 'boolean') {
                silent = event;
                event = null;
            }
            
            const btn = event?.target;
            if (!silent && btn) {
                btn.disabled = true;
            }
            
            if (!silent) {
                updateOutput({ status: 'Loading status...' }, '📊 Status');
            }
            
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (!silent) {
                    updateOutput(data, '📊 Bot Status');
                }
                updateStats(data);
                
                // Starte Auto-Refresh wenn Sync läuft
                if (data.currentSync && data.currentSync.isRunning) {
                    startAutoRefresh();
                } else if (autoRefreshInterval) {
                    stopAutoRefresh();
                }
                
                if (!silent && data.healthy) {
                    showAlert('✅ Bot is healthy and running!', 'success');
                } else if (!silent) {
                    showAlert('⚠️ Bot status check completed', 'info');
                }
            } catch (error) {
                if (!silent) {
                    updateOutput({ error: error.message }, '❌ Error');
                    showAlert('❌ Error: ' + error.message, 'error');
                }
            } finally {
                if (!silent && btn) {
                    btn.disabled = false;
                }
            }
        }

        async function clearRedis(event) {
            if (!confirm('⚠️ This will clear ALL data (topics & posted files). Continue?')) {
                return;
            }
            
            const btn = event?.target;
            if (btn) btn.disabled = true;
            
            showAlert('🗑️ Clearing Redis...', 'info');
            updateOutput({ status: 'Clearing Redis store...' }, '🗑️ Clear Redis');
            
            try {
                const response = await fetch('/api/clear-redis?token=clear-redis-now');
                const data = await response.json();
                
                updateOutput(data, '🗑️ Clear Result');
                
                if (data.success) {
                    showAlert(`✅ Redis cleared! Removed ${data.keys ? data.keys.length : 0} keys.`, 'success');
                    document.getElementById('stats').style.display = 'none';
                } else {
                    showAlert('❌ Failed to clear Redis', 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // Auto-load status on page load
        window.addEventListener('load', () => {
            setTimeout(() => checkStatus(null, false), 500);
        });
    </script>
</body>
</html>
