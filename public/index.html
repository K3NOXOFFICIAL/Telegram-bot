<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Telegram Bot - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .content {
            padding: 40px;
        }
        .control-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .control-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        .btn-status {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .btn-clear {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }
        .status-display {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status-display pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #0088cc;
            margin: 10px 0;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid;
        }
        .alert-success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .alert-info {
            background: #d1ecf1;
            border-color: #0c5460;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 OneDrive Telegram Bot</h1>
            <p>Control Panel & Monitor</p>
        </div>
        
        <div class="content">
            <div class="control-panel">
                <h2>🎮 Sync Control</h2>
                <div class="button-group">
                    <button class="btn-start" onclick="startSync()">
                        ▶️ Start Sync
                    </button>
                    <button class="btn-stop" onclick="stopSync()">
                        ⏸️ Stop Sync
                    </button>
                    <button class="btn-status" onclick="checkStatus()">
                        📊 Status
                    </button>
                    <button class="btn-clear" onclick="clearRedis()">
                        🗑️ Clear Redis
                    </button>
                </div>
                
                <div id="alert-container"></div>
                
                <div id="stats" class="stats-grid" style="display:none;"></div>
                
                <div id="output" class="status-display">
                    <div class="loading">Click a button to get started...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let syncRunning = false;

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function updateOutput(data, title = '') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleString('de-DE');
            output.innerHTML = `
                <strong>${title}</strong><br>
                <small>🕐 ${timestamp}</small><br><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        function updateStats(data) {
            const statsDiv = document.getElementById('stats');
            
            if (data.stats) {
                statsDiv.style.display = 'grid';
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Folders Scanned</div>
                        <div class="stat-value">${data.stats.foldersScanned || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Files Found</div>
                        <div class="stat-value">${data.stats.filesFound || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Files Posted</div>
                        <div class="stat-value">${data.stats.filesPosted || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Errors</div>
                        <div class="stat-value">${data.stats.errors || 0}</div>
                    </div>
                `;
            } else if (data.state) {
                statsDiv.style.display = 'grid';
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Posted Files</div>
                        <div class="stat-value">${data.state.totalPostedFiles || 0}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Topics</div>
                        <div class="stat-value">${data.state.totalTopicMappings || 0}</div>
                    </div>
                `;
            }
        }

        async function startSync() {
            const btn = event.target;
            btn.disabled = true;
            
            showAlert('🚀 Starting sync...', 'info');
            updateOutput({ status: 'Starting sync...' }, '▶️ Start Sync');
            
            try {
                const response = await fetch('/api/sync');
                const data = await response.json();
                
                updateOutput(data, '▶️ Sync Result');
                updateStats(data);
                
                if (data.success) {
                    showAlert('✅ Sync completed successfully!', 'success');
                } else {
                    showAlert('❌ Sync failed: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function stopSync() {
            showAlert('⏸️ Stopping sync (clearing lock)...', 'info');
            updateOutput({ status: 'Stopping sync by clearing Redis lock...' }, '⏸️ Stop Sync');
            
            try {
                const response = await fetch('/api/clear-redis?token=clear-redis-now');
                const data = await response.json();
                
                updateOutput(data, '⏸️ Stop Result');
                
                if (data.success) {
                    showAlert('✅ Sync stopped! Lock cleared.', 'success');
                } else {
                    showAlert('❌ Failed to stop sync', 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            }
        }

        async function checkStatus() {
            const btn = event.target;
            btn.disabled = true;
            
            updateOutput({ status: 'Loading status...' }, '📊 Status');
            
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                updateOutput(data, '📊 Bot Status');
                updateStats(data);
                
                if (data.healthy) {
                    showAlert('✅ Bot is healthy and running!', 'success');
                } else {
                    showAlert('⚠️ Bot status check completed', 'info');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function clearRedis() {
            if (!confirm('⚠️ This will clear ALL data (topics & posted files). Continue?')) {
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            
            showAlert('🗑️ Clearing Redis...', 'info');
            updateOutput({ status: 'Clearing Redis store...' }, '🗑️ Clear Redis');
            
            try {
                const response = await fetch('/api/clear-redis?token=clear-redis-now');
                const data = await response.json();
                
                updateOutput(data, '🗑️ Clear Result');
                
                if (data.success) {
                    showAlert(`✅ Redis cleared! Removed ${data.keys ? data.keys.length : 0} keys.`, 'success');
                    document.getElementById('stats').style.display = 'none';
                } else {
                    showAlert('❌ Failed to clear Redis', 'error');
                }
            } catch (error) {
                updateOutput({ error: error.message }, '❌ Error');
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // Auto-load status on page load
        window.addEventListener('load', () => {
            setTimeout(checkStatus, 500);
        });
    </script>
</body>
</html>
